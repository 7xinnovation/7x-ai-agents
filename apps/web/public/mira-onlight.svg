<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Mira — ميره">
  <!-- Interim Mira wordmark (FB-1889, 2026-10-12), drawn in the same language as
       the AISHA mark it replaces: the opening letters in the azure gradient, the
       rest in navy, a sparkle over the i, the Arabic name beneath. Replace with
       the designer's final asset when it lands; keep the file name. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe4ff"/>
      <stop offset="0.55" stop-color="#2b90ee"/>
      <stop offset="1" stop-color="#0d5bff"/>
    </linearGradient>
  </defs>
  <g transform="translate(286 76)">
    <path fill="url(#g)" d="M0,-40 C0,-8 8,0 40,0 C8,0 0,8 0,40 C0,8 -8,0 -40,0 C-8,0 0,-8 0,-40 Z"/>
  </g>
  <g transform="translate(338 36)">
    <path fill="url(#g)" d="M0,-20 C0,-4 4,0 20,0 C4,0 0,4 0,20 C0,4 -4,0 -20,0 C-4,0 0,-4 0,-20 Z"/>
  </g>
  <text x="34" y="286" font-family="Poppins, Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif" font-weight="700" font-size="232" letter-spacing="-6">
    <tspan fill="url(#g)">Mi</tspan><tspan fill="#1b1464">ra</tspan>
  </text>
  <text x="766" y="372" text-anchor="end" direction="rtl" font-family="Tajawal, 'Noto Kufi Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif" font-weight="700" font-size="92" fill="#1b1464">ميره</text>
  <rect x="34" y="378" width="400" height="3" rx="1.5" fill="#8f8cd9"/>
</svg>
