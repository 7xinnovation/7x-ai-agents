<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400" role="img" aria-label="Mira — ميره">
  <!-- Interim Mira wordmark (FB-1889, 2026-10-12), drawn in the same language as
       the AISHA mark it replaces: the opening letters in the azure gradient, the
       rest in navy, a sparkle over the i, the Arabic name beside it. It is laid
       out on one line so that it stays legible at the 26px header height.
       Replace with the designer's final asset when it lands; keep the file name. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe4ff"/>
      <stop offset="0.55" stop-color="#2b90ee"/>
      <stop offset="1" stop-color="#0d5bff"/>
    </linearGradient>
  </defs>
  <g transform="translate(372 84)">
    <path fill="url(#g)" d="M0,-52 C0,-10 10,0 52,0 C10,0 0,10 0,52 C0,10 -10,0 -52,0 C-10,0 0,-10 0,-52 Z"/>
  </g>
  <g transform="translate(440 40)">
    <path fill="url(#g)" d="M0,-24 C0,-5 5,0 24,0 C5,0 0,5 0,24 C0,5 -5,0 -24,0 C-5,0 0,-5 0,-24 Z"/>
  </g>
  <text x="30" y="330" font-family="Poppins, Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif" font-weight="700" font-size="300" letter-spacing="-8">
    <tspan fill="url(#g)">Mi</tspan><tspan fill="#1b1464">ra</tspan>
  </text>
  <rect x="790" y="112" width="6" height="200" rx="3" fill="#8f8cd9" opacity="0.55"/>
  <text x="1370" y="300" text-anchor="end" font-family="Tajawal, 'Noto Kufi Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif" font-weight="700" font-size="190" fill="#1b1464">ميره</text>
</svg>
