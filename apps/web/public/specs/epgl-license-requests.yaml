          description: Missing or invalid access token.

  /services/apexrest/EPGL/LicenseRequest/status:
    get:
      operationId: getRequestStatus
      tags: [License Request]
      summary: Retrieve request status (API 3)
      description: >
        Returns the current status of a license request, located by the Agent-supplied the Salesforce record id.
      parameters:
        - { name: id, in: query, required: false, schema: { type: string }, description: Salesforce EPG_License_Request__c record id }
      responses:
        '200':
          description: Current request status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestStatus' }
              example:
                salesforceRecordId: a1A5f00000XXXXXAAA
                licenseNumber: null
                requestStatus: Under document review
                lastUpdated: '2026-06-18T10:15:00.000+0000'
        '401': { description: Missing or invalid access token. }
        '404': { description: Request not found. }

  /services/apexrest/EPGL/LicenseRequest/duplicate-check:
    post:
      operationId: duplicateCheck
      tags: [License Request]
      summary: Duplicate submission check (API 4 – optional)
      description: >
        Optional pre-submit check. Duplicate handling is already built into the submit
        endpoint (upsert), so this is not required. Matching criteria are to be confirmed
        by Business.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateCheckRequest' }
            example:
              tradeLicenseNumber: '2137129'
              emiratesId: '784194147908318'
              email: omnia01@mailinator.com
              mobileNumber: +971-55555555
      responses:
        '200':
          description: Match result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateCheckResponse' }
              example:
                matchFound: true
                matchedRecordIds: ['0015f00000XXXXXAAA']
                matchedRequests:
                  - matchedRequestStatus: Under document review
                    matchedRequestNumber: LR234
                    recommendedAction: Update existing application
        '401': { description: Missing or invalid access token. }

  /services/apexrest/EPGL/Document:
    post:
      operationId: uploadDocument
      tags: [Documents]
      summary: Upload / attach a document to the License Request (API 5)
      description: >
        Uploads a file (base64) into Salesforce as a File (ContentVersion) and links it to
        the License Request via ContentDocumentLink. Files are stored inside Salesforce;
        no external document service is used.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUploadRequest' }
            example:
              licenseRequestId: a1A5f00000XXXXXAAA
              fileName: NewRenewCommitmentForm.pdf
              fileType: pdf
              versionData: JVBERi0xLjQKJ... (base64)
      responses:
        '201':
          description: Document stored and linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadResponse' }
              example:
                contentDocumentId: 069XXXXXXXXXXXXAAA
                contentVersionId: 068XXXXXXXXXXXXAAA
                linkedTo: a1A5f00000XXXXXAAA
                success: true
        '400': { description: Invalid file or missing link target. }
        '401': { description: Missing or invalid access token. }

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: >
        OAuth 2.0 Client Credentials flow via a dedicated External Client App
        ("Agent_AI") + a least-privilege integration user. The tokenUrl below targets
        the sandbox shown in Postman (epro--preprod2). When promoting to UAT/production,
        swap it for that environment's My Domain token endpoint (or
        https://login.salesforce.com/services/oauth2/token).
        client_id and client_secret must come from a secret store / Postman environment
        variables (or a vault) – never commit or hardcode them in this spec.
      flows:
        clientCredentials:
          tokenUrl: https://epro--preprod2.sandbox.my.salesforce.com/services/oauth2/token
          scopes: {}
          # Intentionally empty: Salesforce's client-credentials token endpoint rejects a
          # "scope" request parameter outright (400 invalid_request, "scope parameter not
          # supported"). Scope is enforced server-side via the External Client App's OAuth
          # Scopes policy ("api" is selected there), not negotiated at token-request time.
          # Listing a scope here makes Swagger UI / codegen send scope=..., which Salesforce
          # rejects – so leave this map empty.
      x-tokenRequest:
        description: >
          The "clientCredentials" flow implies grant_type=client_credentials, but OpenAPI
          has no field to spell that out – documented here for implementers building the
          actual token call (matches the Postman request body, x-www-form-urlencoded).
          Do not send a "scope" parameter; Salesforce rejects it for this grant type.
        contentType: application/x-www-form-urlencoded
        parameters:
          grant_type:
            value: client_credentials
            required: true
          client_id:
            description: External Client App ("Agent_AI") consumer key. Store in a secret / env var.
            required: true
          client_secret:
            description: External Client App consumer secret. Store in a secret / env var.
            required: true

  schemas:
    # ---- Composite wrappers (submit) ----
    CompositeRequest:
      type: object
      required: [compositeRequest]
      properties:
        allOrNone:
          type: boolean
          default: true
          description: When true, all subrequests succeed or the whole call rolls back.
        isAgentSource:
          type: boolean
          default: false
          description: >
            Overrides the server-derived Agent-source flag for this call. When true,
            CompositeHandler matches/updates existing records by explicit identifier
            (Account.Id, EPG_License_Request__c.Name, EPG_Partner__c.EPG_Emirates_ID__c,
            Contact.Email, Members__c.Name, User.EPG_Emirates_Id__c) instead of the default
            upsert keys. Required (true) on Update requests; omit or set false for a plain
            Create.
        compositeRequest:
          type: array
          items: { $ref: '#/components/schemas/CompositeSubrequest' }
    CompositeSubrequest:
      type: object
      required: [referenceId, method, url]
      properties:
        referenceId:
          type: string
          example: NewAccount
          description: 'Unique id; referenced by later subrequests as @{referenceId.id}'
        method:
          type: string
          enum: [GET, POST, PATCH, PUT, DELETE]
          description: 'Informational; the endpoint upserts regardless'
        url:
          type: string
          example: /services/data/v66.0/sobjects/Account
          description: 'Only the last path segment is read, to derive the target object'
        body:
          description: >
            A single object {} or an array of objects [{}].
            IMPORTANT: CompositeHandler expects Map<String,Object> per item — use a plain
            object {} for EPG_Trial_Balance__c entries (NewBranch, NewTrialBalance), not an
            array. Sending an array body for the last composite item causes a runtime
            cast error (List<ANY> to Map<String,ANY>).
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: { type: object, additionalProperties: true }
          nullable: true
    CompositeResponse:
      type: object
      properties:
        compositeResponse:
          type: array
          items: { $ref: '#/components/schemas/CompositeSubresponse' }
    CompositeSubresponse:
      type: object
      properties:
        referenceId: { type: string }
        httpStatusCode: { type: integer }
        httpHeaders: { type: object, additionalProperties: { type: string } }
        body:
          type: object
          properties:
            id: { type: string, nullable: true }
            success: { type: boolean }
            errors: { type: array, items: { type: string } }

    # ---- API 3 / 4 / 5 ----
    RequestStatus:
      type: object
      description: API 3 – request status read-back.
      properties:
        salesforceRecordId: { type: string, description: Parent record Id }
        licenseNumber: { type: string, nullable: true, description: Null until issued }
        requestStatus: { type: string, description: 'e.g. Under document review, Rejected – full set [TO BE CONFIRMED]' }
        lastUpdated: { type: string, format: date-time, description: ISO 8601 }
    DuplicateCheckRequest:
      type: object
      description: 'API 4 – candidate matching criteria (final rules [TO BE CONFIRMED]).'
      properties:
        emiratesId: { type: string }
        tradeLicenseNumber: { type: string }
        accountNumber: { type: string }
        email: { type: string, format: email }
        mobileNumber: { type: string }
    DuplicateCheckResponse:
      type: object
      properties:
        matchFound: { type: boolean }
        matchedRecordIds: { type: array, items: { type: string } }
        matchedRequests: { type: array, items: { $ref: '#/components/schemas/MatchedRequest' } }
    MatchedRequest:
      type: object
      description: One entry per existing EPG_License_Request__c found under a matched account.
      properties:
        matchedRequestStatus: { type: string, nullable: true }
        matchedRequestNumber: { type: string, nullable: true }
        recommendedAction: { type: string, nullable: true }
    DocumentUploadRequest:
      type: object
      description: API 5 – file stored as ContentVersion and linked to the License Request.
      required: [licenseRequestId, fileName, versionData]
      properties:
        licenseRequestId: { type: string, description: EPG_License_Request__c Id to attach the file to }
        fileName: { type: string, example: NewRenewCommitmentForm.pdf }
        fileType: { type: string, example: pdf, description: 'Supported types [CONFIRM]' }
        versionData: { type: string, format: byte, description: Base64-encoded file content }
    DocumentUploadResponse:
      type: object
      properties:
        contentDocumentId: { type: string }
        contentVersionId: { type: string }
        linkedTo: { type: string, description: License Request Id }
        success: { type: boolean }

    # ---- Target sObjects (from Appendix A) ----
    Account:
      type: object
      description: Legal entity / trade license. Upsert key – EPG_Trade_license_no__c.
      required: [Name, EPG_Trade_license_no__c, RecordTypeId]
      properties:
        Id: { type: string, description: 'Required on Update (Agent-sourced) – Salesforce Account Id used to match the existing record.' }
        Name: { type: string }
        EPG_Company_Name_Arabic__c: { type: string }
        EPG_Company_Status__c: { type: string, example: Active }
        EPG_Trade_license_no__c: { type: string, example: '2137129' }
        EPG_Trade_Name_in_English__c: { type: string }
        EPG_Trade_Name_in_Arabic__c: { type: string }
        EPG_Regulator__c: { type: string }
        BillingStreet: { type: string }
        BillingCity: { type: string }
        BillingState: { type: string }
        BillingPostalCode: { type: string, nullable: true }
        BillingCountry: { type: string }
        EPG_Emirates__c: { type: string }
        EPG_Region__c: { type: string }
        EPG_TRN_No__c: { type: string, nullable: true }
        EPG_PO_Box__c: { type: string }
        RecordTypeId: { type: string, example: 0125f000001xIheAAE }
        Local_Governmental_Entity__c: { type: string, nullable: true }
        License_Expiry_Date__c: { type: string, format: date }
    EPGPartner:
      type: object
      description: EPG_Partner__c – owners / shareholders. Upsert key – EPG_Company__c + EPG_Emirates_ID__c.
      required: [Name, EPG_Company__c]
      properties:
        Name: { type: string }
        EPG_Company__c: { type: string, description: 'Account Id or @{NewAccount.id}' }
        EPG_Share_holder_type__c: { type: string, example: Est. Owner }
        EPG_Contact_No__c: { type: string }
        EPG_Emirates_ID__c: { type: string, description: 'Required on Update (Agent-sourced) – matches the existing Partner under the Account.' }
        EPG_Status__c: { type: string, example: Active }
        EPG_Nationality__c: { type: string }
        EPG_Passport_No__c: { type: string }
        EPG_Passport_Expiry_Date__c: { type: string, format: date }
    Contact:
      type: object
      description: Secondary contacts.
      required: [LastName, AccountId]
      properties:
        FirstName: { type: string }
        LastName: { type: string }
        Email: { type: string, format: email, description: 'Required on Update (Agent-sourced) – matches the existing Contact under the Account.' }
        Phone: { type: string }
        Title: { type: string }
        EPG_Designation__c: { type: string }
        AccountId: { type: string, description: 'Account Id or @{NewAccount.id}' }
        EPG_Country_Code__c: { type: string, example: UAE(+971) }
        Secondary_Contact: { type: string, enum: ['True', 'False'] }
    User:
      type: object
      description: Portal applicant. Login fields (Username/Alias/Profile/locale) generated server-side.
      required: [FirstName, LastName, Email]
      properties:
        AccountId: { type: string, description: 'Account Id or @NewAccount.id' }
        FirstName: { type: string }
        LastName: { type: string }
        Email: { type: string, format: email }
        Phone: { type: string }
        EPG_Emirates_Id__c: { type: string, description: 'Required on Update (Agent-sourced) – matches the existing User.' }
    Members:
      type: object
      description: >
        Members__c – board members / managers. Upsert key – AccountId__c + Name (NameEn).
        EPG_Contact__c and EPG_Designation__c do NOT exist on this object (EPGL, 2026-09-08);
        a row without Name is filed as "Unknown Member".
      required: [AccountId__c, Name]
      properties:
        AccountId__c: { type: string, description: 'Account Id or @{NewAccount.id}' }
        Name: { type: string, description: 'Required on Update (Agent-sourced) – matches the existing Member under the Account.' }
    EPGDocument:
      type: object
      description: EPG_Document__c – document metadata (processed internally). Upsert key – EPG_File_Id__c.
      required: [EPG_Company__c, EPG_File_Id__c]
      properties:
        EPG_Company__c: { type: string, description: 'Account Id or @{NewAccount.id}' }
        EPG_File_Name__c: { type: string, example: NewRenewCommitmentForm.pdf }
        docType__c: { type: string, example: pdf }
        fileType__c: { type: string, example: pdf }
        EPG_File_Id__c: { type: string }
        fileSize__c: { type: integer }
        location__c: { type: string, nullable: true }
    EPGLicenseRequest:
      type: object
      description: EPG_License_Request__c – the license request record.
      required: [RecordTypeId, EPG_Account__c]
      properties:
        Name: { type: string, description: 'Required on Update (Agent-sourced) – License Request Name used to match the existing record.' }
        RecordTypeId: { type: string, example: 0125f000001xIhuAAE }
        EPG_Service__c: { type: string, example: a1H5f0000033Q7pEAE }
        EPG_Account__c: { type: string, description: 'Account Id or @{NewAccount.id}' }
        serviceId__c: { type: string, example: S-EPG-000002 }
        serviceNameEN__c: { type: string, example: Issue Postal Activity License }
        serviceNameAR__c: { type: string }
        providerCode__c: { type: string, nullable: true, description: Defaults to EPG }
        submissionCount__c: { type: integer, example: 1 }
        # Corrected 2026-09-08 from EPGL's review of LR-37214. Their published
        # spec named Terms_Conditions_Accepted__c here and omitted the request's
        # own emirate/region entirely; both are wrong. Kept in this copy so the
        # next import does not reintroduce them.
        Activity_Codes__c:
          type: string
          example: '5320002,5320009'
          description: >
            NUMERIC postal activity codes, comma-separated — never descriptive text.
            Accepted values: 5320002 Letters & Post Items Delivery, 5320007 Documents
            Delivery, 5320009 Parcels Delivery. These are the postal activities applied
            for, NOT the company's trade-licence activities.
        EPG_Terms_and_Conditions__c: { type: boolean, description: 'Terms acceptance. This is the field that drives the checkbox — NOT Terms_Conditions_Accepted__c, which does not exist on the object.' }
        EPG_Current_Emirate__c: { type: string, example: Dubai, description: 'Text. The emirate on the REQUEST — the Account has its own EPG_Emirates__c.' }
        EPG_Current_Region__c: { type: string, example: Al Mankhool, description: 'Text. The region on the REQUEST — the Account has its own EPG_Region__c.' }

    # ---- Renewal-specific (Appendix B) ----
    Branch:
      type: object
      description: >
        Renewal Branch Details (EPG_Trial_Balance__c). Linked to the License Request via
        EPG_License_Request__c. Send as a plain object {}, not an array.
      required: [EPG_License_Request__c]
      properties:
        EPG_License_Request__c: { type: string, description: 'License Request Id or @{NewLicenseRequest.id}' }
      additionalProperties: true
    TrialBalance:
      type: object
      description: >
        Renewal quarterly Trial Balance Total Income (AED) — EPG_Trial_Balance__c.
        Linked to the License Request via EPG_License_Request__c.
        Send as a plain object {}, not an array.
      required: [EPG_License_Request__c]
      properties:
        EPG_License_Request__c: { type: string, description: 'License Request Id or @{NewLicenseRequest.id}' }
        TrialBalance_Q1__c: { type: string, description: Quarter 1 total income (AED) }
        TrialBalance_Q2__c: { type: string, description: Quarter 2 total income (AED) }
        TrialBalance_Q3__c: { type: string, description: Quarter 3 total income (AED) }
        TrialBalance_Q4__c: { type: string, description: Quarter 4 total income (AED) }
