  /services/apexrest/EPGL/Document:
    post:
      operationId: uploadDocument
      tags: [Documents]
      summary: Upload / attach a document (API 5)
      description: >
        Creates or updates one EPG_Document__c and stores the file against it. The Agent
        sends the file bytes as base64 in "content"; Salesforce never fetches the file
        from an external service. The file is saved as a ContentVersion and linked to the
        EPG_Document__c record via ContentDocumentLink, which is the same shape a portal
        upload produces, so agent-uploaded documents appear alongside the customer's own.

        ONE DOCUMENT PER CALL. Send a separate request for each file.

        Body shape: the EPG_Document__c field API names, plus "content" for the bytes.

        REQUIRED FIELDS - the call is rejected with 400 if any is missing:
          * EPG_File_Name__c  - the file name, including its extension
          * content           - the file bytes, base64 encoded
          * EPG_Company__c OR EPG_License_Request__c - at least one parent. Both may be
            sent together, in which case the document is linked to both.

        OPTIONAL FIELDS - docType__c, fileType__c, fileSize__c, EPG_File_Id__c, label__c,
        uploadOn__c, uploadBy__c, location__c. Each is written ONLY when supplied, so
        re-sending a document without them does not blank values already on the record.
        fileType__c defaults to the file extension and fileSize__c to the decoded byte
        length when omitted.

        DEDUPLICATION - EPG_Document__c.Name is the document slot and is taken from
        label__c, falling back to EPG_File_Name__c. A second call with the same
        label__c under the same parent UPDATES the existing document (HTTP 200,
        createdNewDocument=false) and attaches the new file, rather than creating a
        duplicate. Send label__c matching the document checklist name
        ("Trade License", "Lease Contract", "Memorandum of Association", ...) so the
        upload is tied to the correct required-document slot; if it is omitted, each
        call with a different file name creates a separate document record.

        EPG_File_Id__c - leave it out unless the file also exists in an external system.
        When omitted Salesforce stores the Salesforce ContentDocumentId there, which is
        what marks the document as uploaded. When supplied, the value is stored as sent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentUploadRequest' }
            examples:
              minimal:
                summary: Minimum required fields
                value:
                  EPG_License_Request__c: a11FW000XfaElH6YIK
                  EPG_File_Name__c: NewRenewCommitmentForm.pdf
                  content: JVBERi0xLjQKJeLjz9MKMyAwIG9iago8PC9UeXBlL1BhZ2U...
              recommended:
                summary: Recommended - label__c ties the file to the checklist slot
                value:
                  EPG_License_Request__c: a11FW000XfaElH6YIK
                  label__c: Trade License
                  EPG_File_Name__c: trade-license.pdf
                  content: JVBERi0xLjQKJeLjz9MKMyAwIG9iago8PC9UeXBlL1BhZ2U...
              full:
                summary: Every supported field
                value:
                  EPG_License_Request__c: a11FW000XfaElH6YIK
                  EPG_Company__c: 001FW00Cmx3RyVwYEK
                  label__c: Trade License
                  EPG_File_Name__c: trade-license.pdf
                  content: JVBERi0xLjQKJeLjz9MKMyAwIG9iago8PC9UeXBlL1BhZ2U...
                  docType__c: Trade license
                  fileType__c: pdf
                  fileSize__c: 399676
                  EPG_File_Id__c: 8dfd84db-24aa-4e8f-bbd8-ad5c227b006e
                  uploadOn__c: '2025-10-24T10:13:52.887Z'
                  uploadBy__c: Agent AI
                  location__c: https://example.com/documents/v1/file/8dfd84db-24aa-4e8f-bbd8-ad5c227b006e
              accountOnly:
                summary: Attach to the company before a licence request exists
                value:
                  EPG_Company__c: 001FW00Cmx3RyVwYEK
                  label__c: Memorandum of Association
                  EPG_File_Name__c: moa.pdf
                  content: JVBERi0xLjQKJeLjz9MKMyAwIG9iago8PC9UeXBlL1BhZ2U...
      responses:
        '201':
          description: >
            A NEW document record was created and the file stored against it.
            createdNewDocument=true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadResponse' }
              example:
                success: true
                documentId: a0vFW006Xl4pwvIYIQ
                contentDocumentId: 069FW003vqaF8YmYAK
                contentVersionId: 068FW003vqaF8YmYAK
                linkedTo: a0vFW006Xl4pwvIYIQ
                checklistId: a0u5f000001qDTFAA2
                documentName: Trade License
                fileName: trade-license.pdf
                createdNewDocument: true
        '200':
          description: >
            An EXISTING document with the same name under the same parent was updated and
            the new file attached to it. createdNewDocument=false. documentId is the same
            record returned by the earlier call; contentDocumentId is the new file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadResponse' }
              example:
                success: true
                documentId: a0vFW006Xl4pwvIYIQ
                contentDocumentId: 069FW003vzdPWYGYA4
                contentVersionId: 068FW003vzdPWYGYA4
                linkedTo: a0vFW006Xl4pwvIYIQ
                checklistId: a0u5f000001qDTFAA2
                documentName: Trade License
                fileName: trade-license-v2.pdf
                createdNewDocument: false
        '400':
          description: >
            The request is rejected and nothing is written. "message" states the reason.
            Causes: empty body; body that is not valid JSON; a missing required field
            (EPG_File_Name__c, content, or both parents); an Id that is not a valid
            Salesforce Id; an Id of the wrong object type; or "content" that is not
            valid base64.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadResponse' }
              examples:
                missingParent:
                  summary: Neither parent supplied
                  value:
                    success: false
                    message: Either licenseRequestId or accountId is required.
                missingContent:
                  summary: No file bytes
                  value:
                    success: false
                    message: content (base64 file data) is required.
                badId:
                  summary: Malformed or wrong-type Id
                  value:
                    success: false
                    message: EPG_License_Request__c is not a valid Salesforce Id.
                badBase64:
                  summary: content is not decodable
                  value:
                    success: false
                    message: content is not valid base64 data.
        '401':
          description: Missing or invalid access token.
        '500':
          description: >
            An unexpected server-side error; nothing usable was returned. Safe to retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUploadResponse' }
              example:
                success: false
                message: 'Unexpected error while uploading the document: ...'
      x-errorLogging: >
        Every non-2xx response is written to EPG_Integration_Log__c with
        EPG_Source_System__c = 'Agent AI' and EPG_Method_Name__c =
        'AgentDocumentUploadAPI.uploadDocument'. The row carries the failure message, the
        request (with the base64 replaced by its length), the response returned to the
        Agent, and the parent Id, so a failed upload can be traced without the Agent
        re-sending it.


  # ---------------------------------------------------------------------------
  # Payment Notification (API 6)
  # Once the Payment Notification is sent to Salesforce, the Payment Advice is
  # automatically marked as Paid, after the request has been approved by the
  # Business Team and its status is set to In Process.
  #
  # Identifier: the deployed Apex (PaymentNotification.cls) binds exactly two names on
  # notifyPayment - "applicationId" and "salesforceId". There is no
  # "licenseRequestSalesforceId" member; an earlier draft of this contract invented it.
  # THE AGENT SENDS "salesforceId" (the License Request's Salesforce record Id).
  # ---------------------------------------------------------------------------
  /services/apexrest/paymentNotification/:
    post:
      operationId: recordPayment
      tags: [Payment]
      summary: Record a completed NI payment result (API 6)
      description: >
        Once the Payment Notification is sent to Salesforce, the Payment Advice is
        automatically marked as Paid, after the request has been approved by the
        Business Team and its status is set to In Process.

        Records the outcome of a payment taken through NI (N-Genius) against a license
        request. Unlike the paths above, this is the REAL deployed path (not a
        placeholder) - the endpoint already exists and is live in the org.

        THE AGENT SENDS notifyPayment.salesforceId - the License Request's Salesforce
        record Id, a globally unique identifier. It is the same value the status API
        returns as salesforceRecordId, so the Agent holds it from submission onwards.

        The endpoint also accepts notifyPayment.applicationId (matching
        EPG_License_Request__c.applicationId__c) for other callers. Send ONE of them:
        applicationId takes precedence when both are present, and the call is rejected
        when neither is. There is no "licenseRequestSalesforceId" field - an earlier
        draft of this contract used that name and it was never implemented.

        On success Salesforce logs a Payment_Notification__c audit record,
        sets the License Request to "Payment Verified", marks its payment advice
        (EPG_Transaction__c, record type Invoice) as "Paid" with the summed transaction
        amounts, and approves the related payment items.

        Responsibility notes for the Agent:
        (1) The payment advice and its Oracle AR invoice are created automatically by
        Salesforce when the request reaches the payable stage - the Agent never creates
        or updates them directly; this call is the Agent's entire write surface.
        (2) Receipt creation and Oracle receipt posting remain a Finance-side step inside
        Salesforce; this call does not close the receipting chain.
        (3) Call this endpoint ONLY for confirmed successful payments. Do not report
        failed or declined payments through it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentNotificationRequest' }
            example:
              entityId: 'Emirates Post Group Licensing - AI Assistant'
              notifyPayment:
                salesforceId: 'a11FW000VmSctdoYIB'
                payment:
                  paymentId: '9490c2c9-0b20-4673-91ed-aa2facbd6335'
                  payOn: '2026-09-04T12:22:53.689Z'
                  payThru: 'N-Genius'
                  paymentMethod: 'CreditCard'
                  paymentStatus: 'completed'
                  transactions:
                    - transactionId: '9490c2c9-0b20-4673-91ed-aa2facbd6335'
                      amount: 1000
                      responseCurrency: { en: 'AED', ar: "درهم" }
      responses:
        '200':
          description: Payment recorded. License Request set to "Payment Verified".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentNotificationResponse' }
              example:
                status: 200
                desc: { code: '43020', en: Success, ar: "نجاح" }
                message: { code: '83250-8635', en: Success, ar: "نجاح" }
                correlationId: 75be3872-da72-4325-9957-36ddc708588a
        '400': { description: 'Neither salesforceId nor applicationId supplied, or malformed body.' }
        '401': { description: Missing or invalid access token. }
        '404': { description: No License Request matches the supplied salesforceId (or applicationId). }

  /services/data/v62.0/query:
    get:
      operationId: readCompanyAndFinanceData
      tags: [Company Data]
      summary: Read company profile & IDEP quarterly figures (API 7 & 8)
      description: >
        Standard Salesforce REST query endpoint - no custom Apex resource required.
        Use the canned SOQL in the examples; all field API names were verified against
        the live org.

        Field notes (corrections to earlier assumptions):
        (1) The Emirates ID lives on Contact as EPG_Emirates_Id__c (lowercase d); for
        applications that arrived via DET also check
        LegalEntity_Profile_Person_EmiratesID__c.
        (2) Contact.EPG_Designation__c is a multi-select picklist - values arrive
        semicolon-separated.
        (2a) Use Account.License_Status__c, NOT Account.EPG_License_Status__c. Both are
        formulas over the same source (EPG_License__r.License_status__c), but
        EPG_License_Status__c is built for the Salesforce UI and returns HTML - e.g.
        "&lt;img src=\"/resource/InactiveLicense\" ... /&gt; Inactive" - whereas
        License_Status__c returns the bare value ("Active" / "Inactive" / "Cancelled").
        EPG_License_Status__c also appends expiry text for active licences; the queries
        below select EPG_License_Expiry_Date__c separately, so nothing is lost.
        (3) EPG_Finance_Summary__c records are keyed to the LICENCE
        (EPG_License_No__c), not the company; the financeSummariesByAccount example
        joins from the Account, so an accountId is still all you need.

        Prerequisite: the Agent integration user must be granted read access on
        Account, Contact and EPG_Finance_Summary__c (object + fields). Granted
        separately by the Salesforce team; not part of this contract file.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
          description: SOQL query (URL-encoded). Use one of the canned examples.
          examples:
            companyByTradeLicense:
              summary: API 7 - company profile by trade licence number
              value: >-
                SELECT Id, Name, EPG_Company_Name_Arabic__c, EPG_Trade_Name_in_English__c,
                EPG_Trade_Name_in_Arabic__c, EPG_Trade_license_no__c,
                EPG_Trade_license_Expiry_date__c, EPG_Trade_license_issuance_date__c,
                EPG_TRN_No__c, EPG_Emirates__c, EPG_Regulator__c, EPG_License_Number__c,
                License_Status__c, EPG_License_Expiry_Date__c,
                (SELECT FirstName, LastName, Email, Phone, EPG_Emirates_Id__c,
                EPG_Designation__c FROM Contacts)
                FROM Account WHERE EPG_Trade_license_no__c = '2137129'
            companyByEmiratesId:
              summary: API 7 - company located via a contact's Emirates ID
              value: >-
                SELECT AccountId, Account.Name, Account.EPG_Trade_license_no__c,
                Account.EPG_Trade_Name_in_English__c, Account.EPG_License_Number__c,
                Account.License_Status__c
                FROM Contact WHERE EPG_Emirates_Id__c = '784194147908318'
            financeSummariesByAccount:
              summary: API 8 - quarterly leviable-income figures for a company
              value: >-
                SELECT EPG_Year__c, Quarter__c, EPG_Leviable_Income__c,
                EPG_Non_Leviable_Income__c, EPG_TotalLevy__c,
                EPG_Form_9_Due_Fees_for_the_period__c, Amount_Paid__c
                FROM EPG_Finance_Summary__c
                WHERE EPG_License_No__c IN
                (SELECT EPG_License__c FROM Account WHERE Id = '0015f00001YKVzWAAX')
                ORDER BY EPG_Year__c DESC, Quarter__c
      responses:
        '200':
          description: Query result. Shape is the standard Salesforce QueryResult.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryResult' }
              examples:
                financeSummaries:
                  summary: API 8 sample (verified data shape)
                  value:
                    totalSize: 2
                    done: true
                    records:
                      - attributes: { type: EPG_Finance_Summary__c }
                        EPG_Year__c: '2026'
                        Quarter__c: Q1
                        EPG_Leviable_Income__c: 5538091.48
                        EPG_Non_Leviable_Income__c: 0
                        EPG_TotalLevy__c: 101603.18
                        EPG_Form_9_Due_Fees_for_the_period__c: 101603.18
                        Amount_Paid__c: null
                      - attributes: { type: EPG_Finance_Summary__c }
                        EPG_Year__c: '2026'
                        Quarter__c: Q2
                        EPG_Leviable_Income__c: 6760279.91
                        EPG_Non_Leviable_Income__c: 0
                        EPG_TotalLevy__c: 131145.37
                        EPG_Form_9_Due_Fees_for_the_period__c: 131145.37
                        Amount_Paid__c: null
        '400': { description: Malformed SOQL. }
        '401': { description: Missing or invalid access token. }
components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      description: >
        OAuth 2.0 Client Credentials flow via a dedicated External Client App
        ("Agent_AI") + a least-privilege integration user. The tokenUrl below targets
        the sandbox shown in Postman (epro--preprod2). When promoting to UAT/production,
        swap it for that environment's My Domain token endpoint (or
        https://login.salesforce.com/services/oauth2/token).
        client_id and client_secret must come from a secret store / Postman environment
        variables (or a vault) – never commit or hardcode them in this spec.
      flows:
        clientCredentials:
          tokenUrl: https://epro--preprod2.sandbox.my.salesforce.com/services/oauth2/token
          scopes: {}
          # Intentionally empty: Salesforce's client-credentials token endpoint rejects a
          # "scope" request parameter outright (400 invalid_request, "scope parameter not
          # supported"). Scope is enforced server-side via the External Client App's OAuth
          # Scopes policy ("api" is selected there), not negotiated at token-request time.
          # Listing a scope here makes Swagger UI / codegen send scope=..., which Salesforce
          # rejects – so leave this map empty.
      x-tokenRequest:
        description: >
          The "clientCredentials" flow implies grant_type=client_credentials, but OpenAPI
          has no field to spell that out – documented here for implementers building the
          actual token call (matches the Postman request body, x-www-form-urlencoded).
          Do not send a "scope" parameter; Salesforce rejects it for this grant type.
        contentType: application/x-www-form-urlencoded
        parameters:
          grant_type:
            value: client_credentials
            required: true
          client_id:
            description: External Client App ("Agent_AI") consumer key. Store in a secret / env var.
            required: true
          client_secret:
            description: External Client App consumer secret. Store in a secret / env var.
            required: true

  schemas:
    # ---- Composite wrappers (submit) ----
    CompositeRequest:
      type: object
      required: [compositeRequest]
      properties:
        allOrNone:
          type: boolean
          default: true
          description: When true, all subrequests succeed or the whole call rolls back.
        isAgentSource:
          type: boolean
          default: false
          description: >
            Overrides the server-derived Agent-source flag for this call. When true,
            CompositeHandler matches/updates existing records by explicit identifier
            (Account.Id, EPG_License_Request__c.Name, EPG_Partner__c.EPG_Emirates_ID__c,
            Contact.Email, Members__c.Name, User.EPG_Emirates_Id__c) instead of the default
            upsert keys. Required (true) on Update requests; omit or set false for a plain
            Create.
        compositeRequest:
          type: array
          items: { $ref: '#/components/schemas/CompositeSubrequest' }
    CompositeSubrequest:
      type: object
      required: [referenceId, method, url]
      properties:
        referenceId:
          type: string
          example: NewAccount
          description: 'Unique id; referenced by later subrequests as @{referenceId.id}'
        method:
          type: string
          enum: [GET, POST, PATCH, PUT, DELETE]
          description: 'Informational; the endpoint upserts regardless'
        url:
          type: string
          example: /services/data/v66.0/sobjects/Account
          description: 'Only the last path segment is read, to derive the target object'
        body:
          description: >
            A single object {} or an array of objects [{}].
            IMPORTANT: CompositeHandler expects Map<String,Object> per item — use a plain
            object {} for EPG_Trial_Balance__c entries (NewBranch, NewTrialBalance), not an
            array. Sending an array body for the last composite item causes a runtime
            cast error (List<ANY> to Map<String,ANY>).
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: { type: object, additionalProperties: true }
          nullable: true
    CompositeResponse:
      type: object
      properties:
        compositeResponse:
          type: array
          items: { $ref: '#/components/schemas/CompositeSubresponse' }
    CompositeSubresponse:
      type: object
      properties:
        referenceId: { type: string }
        httpStatusCode: { type: integer }
        httpHeaders: { type: object, additionalProperties: { type: string } }
        body:
          type: object
          properties:
            id: { type: string, nullable: true }
            success: { type: boolean }
            errors: { type: array, items: { type: string } }

    # ---- API 3 / 4 / 5 ----
    RequestStatus:
      type: object
      description: API 3 – request status read-back.
      properties:
        salesforceRecordId: { type: string, description: Parent record Id }
        licenseNumber: { type: string, nullable: true, description: Null until issued }
        requestStatus: { type: string, description: 'e.g. Under document review, Rejected – full set [TO BE CONFIRMED]' }
        lastUpdated: { type: string, format: date-time, description: ISO 8601 }
    DuplicateCheckRequest:
      type: object
      description: 'API 4 – candidate matching criteria (final rules [TO BE CONFIRMED]).'
      properties:
        emiratesId: { type: string }
        tradeLicenseNumber: { type: string }
        accountNumber: { type: string }
        email: { type: string, format: email }
        mobileNumber: { type: string }
    DuplicateCheckResponse:
      type: object
      properties:
        matchFound: { type: boolean }
        matchedRecordIds: { type: array, items: { type: string } }
        matchedRequests: { type: array, items: { $ref: '#/components/schemas/MatchedRequest' } }
    MatchedRequest:
      type: object
      description: One entry per existing EPG_License_Request__c found under a matched account.
      properties:
        matchedRequestStatus: { type: string, nullable: true }
        matchedRequestNumber: { type: string, nullable: true }
        recommendedAction: { type: string, nullable: true }
    DocumentUploadRequest:
      type: object
      description: >
        API 5 – one document. Uses the EPG_Document__c field API names, plus "content"
        for the base64 bytes.

        REQUIRED: EPG_File_Name__c, content, and at least one of EPG_Company__c /
        EPG_License_Request__c. OpenAPI "required" below lists the two unconditional
        fields; the at-least-one-parent rule is expressed by the anyOf underneath and
        is enforced server-side (400 when neither is present).

        Every other property is OPTIONAL and is written only when supplied — omitting
        one on a re-upload leaves the existing value on the record untouched.
      required: [EPG_File_Name__c, content]
      anyOf:
        - required: [EPG_Company__c]
        - required: [EPG_License_Request__c]
      properties:
        EPG_File_Name__c:
          type: string
          example: trade-license.pdf
          description: REQUIRED. File name including extension; also the Salesforce file title.
        content:
          type: string
          format: byte
          description: >
            REQUIRED. Base64-encoded file content. Raw base64 only — no "data:" URI
            prefix and no line breaks. Rejected with 400 if it cannot be decoded.
        EPG_Company__c:
          type: string
          example: 001FW00Cmx3RyVwYEK
          description: >
            Account Id. Required unless EPG_License_Request__c is supplied. May be sent
            together with EPG_License_Request__c to link the document to both.
        EPG_License_Request__c:
          type: string
          example: a11FW000XfaElH6YIK
          description: >
            EPG_License_Request__c Id. Required unless EPG_Company__c is supplied.
        label__c:
          type: string
          example: Trade License
          description: >
            Optional but STRONGLY RECOMMENDED. Becomes EPG_Document__c.Name and is the
            deduplication key: re-sending the same label__c under the same parent updates
            that document instead of creating a second one, and matches the upload to the
            required-document checklist entry of the same name. Falls back to
            EPG_File_Name__c when omitted.
        docType__c:
          type: string
          example: Trade license
          description: Optional. Free text document type.
        fileType__c:
          type: string
          example: pdf
          description: Optional. Defaults to the EPG_File_Name__c extension when omitted.
        fileSize__c:
          type: number
          example: 399676
          description: Optional. Defaults to the decoded byte length when omitted.
        EPG_File_Id__c:
          type: string
          example: 8dfd84db-24aa-4e8f-bbd8-ad5c227b006e
          description: >
            Optional external file id. Leave it out unless the file also lives in another
            system: when omitted Salesforce stores the ContentDocumentId here, which is
            what marks the document as uploaded.
        uploadOn__c:
          type: string
          format: date-time
          example: '2025-10-24T10:13:52.887Z'
          description: Optional ISO-8601 timestamp. Ignored (left null) if unparseable.
        uploadBy__c:
          type: string
          example: Agent AI
          description: Optional. Who supplied the document.
        location__c:
          type: string
          nullable: true
          description: Optional source URL.
    DocumentUploadResponse:
      type: object
      description: >
        Returned for success (201/200) and for handled failures (400/500). Always check
        "success"; on failure "message" carries the reason and the document fields are absent.
      properties:
        success:
          type: boolean
          description: True only when the document was saved.
        documentId:
          type: string
          description: EPG_Document__c record Id, created or updated.
        contentDocumentId:
          type: string
          description: ContentDocument Id of the stored file.
        contentVersionId:
          type: string
          description: ContentVersion Id of the stored file.
        linkedTo:
          type: string
          description: The record the file is attached to — the EPG_Document__c Id.
        checklistId:
          type: string
          nullable: true
          description: >
            EPG_Document_Checklist__c matched by name, or null when no active checklist
            entry matches the document name.
        documentName:
          type: string
          description: The resolved EPG_Document__c.Name (from label__c, else the file name).
        fileName:
          type: string
          description: The stored file name.
        createdNewDocument:
          type: boolean
          description: True when a new document record was created (201), false on update (200).
        message:
          type: string
          nullable: true
          description: Failure reason. Present on 400/500, absent on success.

    # ---- Target sObjects (from Appendix A) ----
    Account:
      type: object
      description: Legal entity / trade license. Upsert key – EPG_Trade_license_no__c.
      required: [Name, EPG_Trade_license_no__c, RecordTypeId]
      properties:
        Id: { type: string, description: 'Required on Update (Agent-sourced) – Salesforce Account Id used to match the existing record.' }
        Name: { type: string }
        EPG_Company_Name_Arabic__c: { type: string }
        EPG_Company_Status__c: { type: string, example: Active }
        EPG_Trade_license_no__c: { type: string, example: '2137129' }
        EPG_Trade_Name_in_English__c: { type: string }
        EPG_Trade_Name_in_Arabic__c: { type: string }
        EPG_Regulator__c: { type: string }
        BillingStreet: { type: string }
        BillingCity: { type: string }
        BillingState: { type: string }
        BillingPostalCode: { type: string, nullable: true }
        BillingCountry: { type: string }
        EPG_Emirates__c: { type: string }
        EPG_Region__c: { type: string }
        EPG_TRN_No__c: { type: string, nullable: true }
        EPG_PO_Box__c: { type: string }
        RecordTypeId: { type: string, example: 0125f000001xIheAAE }
        License_Expiry_Date__c: { type: string, format: date }
    EPGPartner:
      type: object
      description: EPG_Partner__c – owners / shareholders. Upsert key – EPG_Company__c + EPG_Emirates_ID__c.
      required: [Name, EPG_Company__c]
      properties:
        Name: { type: string }
        EPG_Company__c: { type: string, description: 'Account Id or @{NewAccount.id}' }
        EPG_Share_holder_type__c: { type: string, example: Est. Owner }
        EPG_Contact_No__c: { type: string }
        EPG_Emirates_ID__c: { type: string, description: 'Required on Update (Agent-sourced) – matches the existing Partner under the Account.' }
        EPG_Status__c: { type: string, example: Active }
        EPG_Nationality__c: { type: string }
        EPG_Passport_No__c: { type: string }
        EPG_Passport_Expiry_Date__c: { type: string, format: date }
    Contact:
      type: object
      description: Secondary contacts.
      required: [LastName, AccountId]
      properties:
        FirstName: { type: string }
        LastName: { type: string }
        Email: { type: string, format: email, description: 'Required on Update (Agent-sourced) – matches the existing Contact under the Account.' }
        Phone: { type: string }
        Title: { type: string }
        EPG_Designation__c: { type: string, description: 'Multi-select picklist – values are semicolon-separated.' }
        AccountId: { type: string, description: 'Account Id or @{NewAccount.id}' }
        EPG_Country_Code__c: { type: string, example: UAE(+971) }
        Is_Secondary_Contact__c: { type: string, enum: ['True', 'False'] }
    User:
      type: object
      description: Portal applicant. Login fields (Username/Alias/Profile/locale) generated server-side.
      required: [FirstName, LastName, Email]
      properties:
        AccountId: { type: string, description: 'Account Id or @NewAccount.id' }
        FirstName: { type: string }
        LastName: { type: string }
        Email: { type: string, format: email }
        Phone: { type: string }
        EPG_Emirates_Id__c: { type: string, description: 'Required on Update (Agent-sourced) – matches the existing User.' }
    Members:
      type: object
      description: Members__c – board members / managers. Upsert key – AccountId__c + Name (NameEn).
      required: [AccountId__c]
      properties:
        AccountId__c: { type: string, description: 'Account Id or @{NewAccount.id}' }
        Name: { type: string, description: 'Required on Update (Agent-sourced) – matches the existing Member under the Account.' }
    # EPG_Document__c is no longer part of the composite payload. Documents are sent
    # one per call to API 5 (POST /Document) – see DocumentUploadRequest.
    EPGLicenseRequest:
      type: object
      description: EPG_License_Request__c – the license request record.
      required: [RecordTypeId, EPG_Account__c]
      properties:
        Name: { type: string, description: 'Required on Update (Agent-sourced) – License Request Name used to match the existing record.' }
        RecordTypeId: { type: string, example: 0125f000001xIhuAAE }
        EPG_Service__c: { type: string, example: a1H5f0000033Q7pEAE }
        EPG_Account__c: { type: string, description: 'Account Id or @{NewAccount.id}' }
        serviceId__c: { type: string, example: S-EPG-000002 }
        serviceNameEN__c: { type: string, example: Issue Postal Activity License }
        serviceNameAR__c: { type: string }
        providerCode__c: { type: string, nullable: true, description: Defaults to EPG }
        submissionCount__c: { type: integer, example: 1 }
        Activity_Codes__c: { type: string, example: '5320002' }
        EPG_Terms_and_Conditions__c: { type: boolean, description: Required for renewal. }

    # ---- Renewal-specific (Appendix B) ----
    Branch:
      type: object
      description: >
        Renewal Branch Details (EPG_Trial_Balance__c). Linked to the License Request via
        EPG_License_Request__c. Send as a plain object {}, not an array.
      required: [EPG_License_Request__c]
      properties:
        EPG_License_Request__c: { type: string, description: 'License Request Id or @{NewLicenseRequest.id}' }
      additionalProperties: true
    TrialBalance:
      type: object
      description: >
        Renewal quarterly Trial Balance Total Income (AED) — EPG_Trial_Balance__c.
        Linked to the License Request via EPG_License_Request__c.
        Send as a plain object {}, not an array.
      required: [EPG_License_Request__c]
      properties:
        EPG_License_Request__c: { type: string, description: 'License Request Id or @{NewLicenseRequest.id}' }
        TrialBalance_Q1__c: { type: string, description: Quarter 1 total income (AED) }
        TrialBalance_Q2__c: { type: string, description: Quarter 2 total income (AED) }
        TrialBalance_Q3__c: { type: string, description: Quarter 3 total income (AED) }
        TrialBalance_Q4__c: { type: string, description: Quarter 4 total income (AED) }

    PaymentNotificationRequest:
      type: object
      required: [notifyPayment]
      properties:
        entityId: { type: string, description: Caller identifier (e.g. EPGL-CHAT). }
        notifyPayment:
          type: object
          description: >-
            Exactly one identifier is required: the Agent sends salesforceId.
            applicationId exists for other callers and wins if both are supplied.
          required: [payment]
          anyOf:
            - required: [salesforceId]
            - required: [applicationId]
          properties:
            salesforceId:
              type: string
              example: a11FW000VmSctdoYIB
              description: >-
                THE FIELD THE AGENT SENDS. Salesforce record Id of the License Request
                (EPG_License_Request__c.Id) - globally unique. Same value the status API
                returns as salesforceRecordId, so the Agent holds it from submission
                onwards.
            applicationId:
              type: string
              description: >-
                Alternative identifier matching EPG_License_Request__c.applicationId__c,
                used by non-Agent callers. Takes precedence over salesforceId when both
                are present. The Agent should omit it.
            payment:
              type: object
              properties:
                invoiceId: { type: string }
                refInvoiceId: { type: string }
                paymentId: { type: string, description: NI payment reference. }
                payOn: { type: string, description: Payment datetime (ISO 8601). }
                payBy: { type: string }
                payThru: { type: string, description: Channel, e.g. NI. }
                paymentMethod: { type: string }
                paymentStatus: { type: string, description: Send only successful payments (e.g. PAID). }
                transactions:
                  type: array
                  items: { $ref: '#/components/schemas/PaymentTransaction' }
            message:
              type: object
              properties:
                code: { type: string }
                en: { type: string }
                ar: { type: string }
            infos:
              type: array
              items:
                type: object
                properties:
                  infoKey: { type: string }
                  infoValue: { type: string }
    PaymentTransaction:
      type: object
      required: [amount]
      properties:
        transactionId: { type: string }
        refTransactionId: { type: string }
        itemId: { type: string }
        beneficiaryId: { type: string, description: Use EPG. }
        amount: { type: number, description: Amount in AED. Amounts across transactions are summed. }
        responseCurrency:
          type: object
          description: >-
            Note the name. The REQUEST field is "responseCurrency" - that is what the
            deployed Apex binds. The endpoint renames it to "currency" on the way OUT,
            so a response shows "currency" while a request must send "responseCurrency".
          properties:
            en: { type: string }
            ar: { type: string }
    PaymentNotificationResponse:
      type: object
      properties:
        status: { type: integer }
        correlationId: { type: string, nullable: true }
        desc:
          type: object
          properties:
            code: { type: string }
            en: { type: string }
            ar: { type: string }
        message:
          type: object
          properties:
            code: { type: string }
            en: { type: string }
            ar: { type: string }
    QueryResult:
      type: object
      description: Standard Salesforce REST query result envelope.
      properties:
        totalSize: { type: integer }
        done: { type: boolean }
        nextRecordsUrl: { type: string, description: Present when the result is paginated. }
        records:
          type: array
          items:
            type: object
            description: Queried sObject rows; fields depend on the SOQL SELECT list.
            additionalProperties: true
