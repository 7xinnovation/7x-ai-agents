                topLevelError:
                  summary: Malformed JSON / unexpected server error (still HTTP 200)
                  description: >
                    When the request body cannot be parsed or an unexpected exception
                    escapes item processing, a single synthetic item is returned with
                    referenceId=null. HTTP status remains 200.
                  value:
                    compositeResponse:
                      - referenceId: null
                        httpStatusCode: 200
                        httpHeaders: {}
                        body:
                          id: null
                          success: false
                          errors: ['Error processing composite request: Unexpected character (''}'') ... | Class.CompositeHandler.processCompositeRequest: line 68, column 1']
        '400':
          description: >
            Returned ONLY when the payload has no "compositeRequest" array. All other
            failures come back as HTTP 200 with body.success=false per item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompositeResponse' }
              example:
                compositeResponse:
                  - referenceId: null
                    httpStatusCode: 400
                    httpHeaders: {}
